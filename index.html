<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Startup Idea Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--s:#f5f6fa;--tx:#0f1b3d;--mu:#6b7385;--bd:#e3e6ee;--ac:#4f46e5;--ok:#16a34a;--wa:#d97706;--er:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--s:#141a30;--tx:#e8ebf5;--mu:#98a0b8;--bd:#252c47;--ac:#818cf8}}
:root[data-theme=dark]{--bg:#0b1020;--s:#141a30;--tx:#e8ebf5;--mu:#98a0b8;--bd:#252c47;--ac:#818cf8}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Manrope,system-ui,sans-serif}
h1,h2,h3{margin:0 0 8px;letter-spacing:-.02em}h1{font-size:28px}h2{font-size:20px}h3{font-size:15px}
.mu{color:var(--mu);font-size:13px}.app{display:flex;min-height:100vh}
nav{width:210px;padding:18px 12px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav b{display:block;padding:0 10px 14px;font-size:16px}nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--mu);text-decoration:none;font-weight:600;cursor:pointer}
nav a.on{background:var(--s);color:var(--ac)}main{flex:1;min-width:0;padding:24px 28px 40px;max-width:1100px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.c{border:1px solid var(--bd);border-radius:10px;padding:16px;background:var(--bg)}.c.s{background:var(--s)}
.n{font-size:30px;font-weight:800}button,.b{font:inherit;font-weight:600;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
.p{background:var(--ac);color:#fff;border-color:var(--ac)}.d{color:var(--er)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.bar{height:8px;background:var(--s);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--s);color:var(--mu)}.demo{background:#fef3c7;color:#92400e}
.md{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:9}.md>div{background:var(--bg);border-radius:12px;padding:20px;width:100%;max-width:560px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20}
.mx{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.mx div{min-height:84px;padding:6px;border-radius:6px;font-size:12px}
.land{max-width:820px;margin:0 auto;padding:12vh 24px}.land h1{font-size:clamp(34px,7vw,60px);line-height:1.05}
@media(max-width:760px){nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);border-right:0;background:var(--bg);z-index:5}nav b{display:none}nav a{white-space:nowrap;font-size:13px}main{padding:16px 14px 90px}}
@media print{nav,.np,#toast{display:none!important}main{padding:0}}

body{-webkit-font-smoothing:antialiased;line-height:1.6}
.c{border-radius:12px;padding:18px;box-shadow:0 1px 2px #0f1b3d0d}
h1{font-size:30px;font-weight:800;line-height:1.15}h2{font-weight:800}
th{font-size:12px;color:var(--mu);font-weight:700;background:var(--s);white-space:nowrap}tr:hover td{background:var(--s)}
button{transition:border-color .15s,filter .15s}button:hover{border-color:var(--ac)}.p:hover{filter:brightness(1.12)}
.lg{width:28px;height:28px;border-radius:8px;background:var(--ac);color:#fff;display:inline-grid;place-items:center;font-size:14px;font-weight:800}
.bar{height:10px}.tag.demo{margin-top:6px}
@media(min-width:761px){nav{background:var(--s);padding:22px 14px}nav b{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;padding:0 8px 20px}nav a{padding:9px 12px;transition:background .15s}nav a:hover{color:var(--tx)}nav a.on{background:var(--bg);box-shadow:0 0 0 1px var(--bd),0 1px 2px #0f1b3d0d}main{padding:32px 40px 56px;max-width:1280px}}
.lh{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--bd);background:var(--bg)}
.lh b{display:flex;gap:10px;align-items:center}.lw{max-width:1040px;margin:0 auto;padding:0 24px}
.hero{padding:10vh 0 6vh}.hero h1{font-size:clamp(36px,6.4vw,64px);line-height:1.04;letter-spacing:-.035em;max-width:16ch}
.hero p{font-size:18px;max-width:560px;color:var(--mu)}.fl{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:8px 0 56px}
.fl .c b{color:var(--ac)}.sec{margin:0 0 56px}.sec>h2{font-size:26px;letter-spacing:-.02em;margin-bottom:16px}
.qs{columns:2 260px;gap:24px;padding:0;list-style:none}.qs li{padding:9px 0;border-bottom:1px solid var(--bd);font-weight:600}
.ft{border-top:1px solid var(--bd);padding:24px 0 40px;color:var(--mu);font-size:13px}
</style></head><body><div id="root"></div><div id="toast" hidden></div>
<script>
const K='sil_v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const W={sev:['Mức đau của vấn đề',.2],mkt:['Quy mô thị trường',.15],wtp:['Sẵn sàng trả tiền',.15],mvp:['Dễ làm MVP',.1],cap:['Vốn thấp',.1],comp:['Cạnh tranh thấp',.1],scl:['Khả năng mở rộng',.1],fit:['Hợp với founder',.1]};
const store={get(){try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}},set(d){try{localStorage.setItem(K,JSON.stringify(d))}catch(e){toast('Không lưu được dữ liệu trình duyệt')}}};
const empty=()=>({demo:false,problems:[],ideas:[],interviews:[],tasks:[],risks:[],journal:[],fin:{price:500000,c0:5,g:.15,vc:100000,fix:2000000,mkt:3000000,team:0,oth:500000,cap:20000000,churn:.05}});
function demo(){const p=uid(),i=uid(),d=empty();d.demo=true;
d.problems=[{id:p,name:'SME quản lý đơn hàng bằng Excel/Zalo',ind:'Logistics',cust:'SME bán hàng online 50–300 đơn/ngày',pain:8,mkt:7,urg:7,wtp:6,cur:'Excel + nhóm Zalo',ev:'DEMO: giả định, chưa kiểm chứng'}];
d.ideas=[{id:i,pid:p,name:'LogiFlow',pitch:'Quản lý đơn và giao hàng cho SME trên một màn hình',cust:'SME bán online, kho nhỏ',sol:'Web app gom đơn, trạng thái giao, đối soát COD',rev:'Thuê bao 500k/tháng',comp:'Haravan, KiotViet, Excel',mvp:'Google Sheets + form + báo cáo tuần',s:{sev:8,mkt:7,wtp:6,mvp:8,cap:8,comp:4,scl:7,fit:9}}];
d.interviews=[{id:uid(),iid:i,who:'DEMO – Chủ shop A',quote:'Cuối ngày tôi mất 2 tiếng đối soát COD',notes:'',a:{exists:4,freq:5,pain:4,sol:3,wtp:3,ask:2}},{id:uid(),iid:i,who:'DEMO – Quản lý kho B',quote:'Zalo lẫn lộn, hay giao nhầm',notes:'',a:{exists:5,freq:4,pain:4,sol:3,wtp:2,ask:3}}];
d.tasks=[['Phỏng vấn 3 quản lý kho',1,'high','doing'],['Tạo landing page thu email',2,'med','todo'],['Làm MVP bằng Google Sheets',3,'high','todo'],['Thử bán gói 500k cho 3 shop',4,'med','todo']].map(t=>({id:uid(),t:t[0],week:t[1],pr:t[2],st:t[3],iid:i}));
d.risks=[{id:uid(),n:'Khách quen dùng Excel, khó chuyển',cat:'Customer',imp:2,pro:2},{id:uid(),n:'Nền tảng lớn thêm tính năng tương tự',cat:'Competition',imp:2,pro:1}];
d.journal=[{id:uid(),ty:'Insight',tx:'DEMO: khách phàn nàn đối soát COD hơn là quản lý đơn',at:Date.now()}];return d}
let showLand=false,S=store.get(),route=location.hash.slice(1)||'dash',sel=[];
const save=()=>store.set(S);function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t.h);t.h=setTimeout(()=>t.hidden=true,2200)}
const score=i=>Math.round(Object.entries(W).reduce((a,[k,[,w]])=>a+(i.s[k]||0)*w*10,0));
const vscore=iv=>Math.round(Object.values(iv.a).reduce((a,b)=>a+b,0)/30*100);
const vlab=v=>v<=30?['🔴 Yếu','var(--er)']:v<=60?['🟡 Chưa chắc','var(--wa)']:v<=80?['🟢 Triển vọng','var(--ok)']:['🚀 Tín hiệu mạnh','var(--ok)'];
const vavg=id=>{const l=S.interviews.filter(x=>x.iid==id);return l.length?Math.round(l.reduce((a,x)=>a+vscore(x),0)/l.length):null};
function decide(i){const n=S.interviews.filter(x=>x.iid==i.id).length,sc=score(i),v=vavg(i.id);
if(n<5)return['VALIDATE MORE',`Mới có ${n}/5 cuộc phỏng vấn. Chưa đủ bằng chứng để quyết định, dù điểm ý tưởng là ${sc}/100. Hãy phỏng vấn thêm ${5-n} người nữa.`,'var(--wa)'];
if(sc<40||v<31)return["DON'T BUILD",`Điểm ý tưởng ${sc}, validation ${v}. Tín hiệu quá yếu: đổi vấn đề hoặc khách hàng.`,'var(--er)'];
if(sc>=65&&v>=61)return['BUILD',`Điểm ý tưởng ${sc}, validation ${v} từ ${n} cuộc phỏng vấn. Làm MVP nhỏ nhất và thu tiền khách đầu tiên.`,'var(--ok)'];
return['VALIDATE MORE',`Điểm ý tưởng ${sc}, validation ${v}. Chưa đủ rõ: hỏi thêm về giá và khách đang dùng gì.`,'var(--wa)']}
function radar(s){const ks=Object.keys(W),R=80,C=110,pt=(k,r)=>{const a=ks.indexOf(k)/ks.length*6.283-1.571;return[C+Math.cos(a)*R*r,C+Math.sin(a)*R*r]};
const poly=r=>ks.map(k=>pt(k,r).join(',')).join(' ');
return`<svg viewBox="0 0 220 220" width="100%" style="max-width:260px"><polygon points="${poly(1)}" fill="none" stroke="var(--bd)"/><polygon points="${poly(.5)}" fill="none" stroke="var(--bd)"/><polygon points="${ks.map(k=>pt(k,(s[k]||0)/10).join(',')).join(' ')}" fill="var(--ac)" fill-opacity=".25" stroke="var(--ac)" stroke-width="2"/>${ks.map(k=>{const[x,y]=pt(k,1.18);return`<text x="${x}" y="${y}" font-size="9" fill="var(--mu)" text-anchor="middle">${W[k][0].split(' ').slice(-1)}</text>`}).join('')}</svg>`}
function line(series,labels){const all=series.flatMap(s=>s.d),mn=Math.min(0,...all),mx=Math.max(1,...all),w=600,h=200,X=i=>30+i*(w-40)/(labels.length-1),Y=v=>h-10-(v-mn)/(mx-mn)*(h-30);
return`<svg viewBox="0 0 ${w} ${h+10}" width="100%"><line x1="30" x2="${w}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--bd)"/>${series.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${s.d.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`).join('')}${labels.map((l,i)=>i%2?'':`<text x="${X(i)}" y="${h+6}" font-size="10" fill="var(--mu)" text-anchor="middle">T${l}</text>`).join('')}</svg><div class="mu">${series.map(s=>`<span style="color:${s.c}">■</span> ${s.n}`).join(' &nbsp; ')} (đơn vị: triệu VNĐ nếu là tiền)</div>`}
function modal(title,fields,init,ok,del){const m=document.createElement('div');m.className='md';
m.innerHTML=`<div><h2>${title}</h2>${fields.map(f=>`<label>${f.l}</label>${f.t=='area'?`<textarea data-k="${f.k}" rows="3"></textarea>`:f.t=='sel'?`<select data-k="${f.k}">${f.o.map(o=>`<option value="${Array.isArray(o)?o[0]:o}">${Array.isArray(o)?o[1]:o}</option>`).join('')}</select>`:`<input data-k="${f.k}" type="${f.t=='num'?'number':'text'}" ${f.min!=null?`min="${f.min}" max="${f.max}"`:''}>`}`).join('')}<div class="row"><button class="p" id="mok">Lưu</button><button id="mx">Hủy</button>${del?'<button class="d" id="mdl">Xóa</button>':''}</div></div>`;
document.body.append(m);fields.forEach(f=>{const e=m.querySelector(`[data-k="${f.k}"]`);e.value=init[f.k]??f.def??''});
m.querySelector('#mx').onclick=()=>m.remove();
m.querySelector('#mok').onclick=()=>{const o={};fields.forEach(f=>{const v=m.querySelector(`[data-k="${f.k}"]`).value;o[f.k]=f.t=='num'||f.t=='sel'&&f.n?+v:v});if(fields[0].req&&!o[fields[0].k].trim()){toast('Hãy nhập '+fields[0].l);return}ok(o);m.remove()};
if(del)m.querySelector('#mdl').onclick=()=>{if(confirm('Xóa mục này? Không thể hoàn tác.')){del();m.remove()}}}
function upsert(list,o,id,extra={}){if(id){Object.assign(S[list].find(x=>x.id==id),o)}else S[list].push({id:uid(),...extra,...o});save();toast('Đã lưu');render()}
function remove(list,id){S[list]=S[list].filter(x=>x.id!=id);save();toast('Đã xóa');render()}
const ideaOpts=()=>S.ideas.map(i=>[i.id,i.name]);const topIdea=()=>[...S.ideas].sort((a,b)=>score(b)-score(a))[0];
const nm=id=>(S.ideas.find(i=>i.id==id)||{}).name||'—';
const pageHead=(t,sub,btn)=>`<div class="row" style="justify-content:space-between"><div><h1>${t}</h1><div class="mu">${sub}</div></div>${btn||''}</div>${S.demo?'<span class="tag demo">DEMO DATA – dữ liệu giả định, không phải số liệu thị trường thật</span>':''}`;
const empt=(m,a)=>`<div class="c s" style="text-align:center;padding:30px"><p>${m}</p>${a||''}</div>`;
const P={
dash(){const pr=S.problems.length,id=S.ideas.length,iv=S.interviews.length,done=S.tasks.filter(t=>t.st=='done').length;
const st=[['Tìm vấn đề',pr>0],['Tạo ý tưởng',id>0],['Kiểm chứng',iv>=5],['Chọn ý tưởng',id>0&&iv>=5],['Làm MVP',S.tasks.some(t=>t.st=='done')],['Có khách',false],['Mở rộng',false]];
const cur=st.findIndex(s=>!s[1]),pct=Math.round(st.filter(s=>s[1]).length/7*100),ti=topIdea();
const foc=['Hãy ghi vấn đề đầu tiên bạn thấy trong ngành logistics','Hãy tạo ý tưởng từ vấn đề đã có','Phỏng vấn đủ 5 khách hàng để kiểm chứng','Chấm điểm và chọn ý tưởng','Làm MVP nhỏ nhất','Tìm khách trả tiền đầu tiên','Mở rộng'][cur<0?6:cur];
return pageHead('Startup Command Center','Từ vấn đề → ý tưởng → kiểm chứng → MVP → khách hàng')+`
<div class="c" style="margin:14px 0"><div class="row" style="justify-content:space-between;margin:0 0 8px"><b>Hành trình: ${pct}%</b><span class="mu">Đang ở: ${st[cur<0?6:cur][0]}</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="row mu">${st.map((s,i)=>`<span style="${s[1]?'color:var(--ok)':''}">${s[1]?'✓':i+1} ${s[0]}</span>`).join('')}</div><p style="margin:6px 0"><b>${foc}</b></p></div>
<div class="g"><div class="c"><div class="mu">Vấn đề</div><div class="n">${pr}</div></div><div class="c"><div class="mu">Ý tưởng</div><div class="n">${id}</div></div><div class="c"><div class="mu">Phỏng vấn</div><div class="n">${iv}</div></div><div class="c"><div class="mu">Việc xong</div><div class="n">${done}/${S.tasks.length}</div></div></div>
<div class="g g2" style="margin-top:14px"><div class="c"><h3>Ý tưởng đứng đầu</h3>${ti?`<div class="n">${score(ti)}<span class="mu">/100</span></div><b>${esc(ti.name)}</b><div class="mu">${esc(ti.pitch)}</div><div class="row"><span class="tag">Validation: ${vavg(ti.id)??'chưa có'}</span><button onclick="go('decision')">Xem quyết định</button></div>`:empt('Chưa có ý tưởng.','<button class="p" onclick="go(\'engine\')">Tạo ý tưởng</button>')}</div>
<div class="c"><h3>Hôm nay (tối đa 5)</h3>${S.tasks.filter(t=>t.st!='done').sort((a,b)=>({high:0,med:1,low:2}[a.pr]-{high:0,med:1,low:2}[b.pr])).slice(0,5).map(t=>`<div class="row" style="margin:4px 0"><input type="checkbox" style="width:20px" onchange="setTask('${t.id}','done')"> ${esc(t.t)} <span class="tag">${t.pr}</span></div>`).join('')||empt('Không có việc nào. Thêm trong Kế hoạch.')}</div></div>`},
problems(){const q=(window.pq||'').toLowerCase(),l=S.problems.filter(p=>(p.name+p.cust+p.ind).toLowerCase().includes(q)).sort((a,b)=>(b.pain+b.wtp)-(a.pain+a.wtp));
return pageHead('Problem Database','Bắt đầu từ vấn đề có thật. Ghi bằng chứng và nguồn.','<button class="p np" onclick="editP()">+ Thêm vấn đề</button>')+`<input class="np" placeholder="Tìm kiếm…" value="${esc(window.pq||'')}" oninput="pq=this.value;render(1)" style="margin:12px 0">`+(l.length?`<div class="tw"><table><tr><th>Vấn đề</th><th>Khách hàng</th><th>Đau</th><th>TT</th><th>Gấp</th><th>Trả tiền</th><th></th></tr>${l.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="mu">${esc(p.ind)} · hiện dùng: ${esc(p.cur)}</div><div class="mu">Bằng chứng: ${esc(p.ev)||'chưa có'}</div></td><td>${esc(p.cust)}</td><td>${p.pain}</td><td>${p.mkt}</td><td>${p.urg}</td><td>${p.wtp}</td><td><button onclick="editP('${p.id}')">Sửa</button></td></tr>`).join('')}</table></div>`:empt('Chưa có vấn đề nào. Hãy ghi vấn đề bạn thấy khi nói chuyện với chủ shop, kho, hãng vận tải.','<button class="p" onclick="editP()">+ Thêm vấn đề</button>'))},
engine(){const g=window.gen||[],o=(k,a)=>`<label>${k}</label><select id="e_${k}">${a.map(x=>`<option>${x}</option>`).join('')}</select>`;
return pageHead('Idea Engine','Tạo gợi ý từ mẫu có sẵn theo lựa chọn của bạn. Đây là điểm xuất phát, không phải kết luận.')+`<div class="c"><div class="g">${o('Ngành',['Logistics','Supply Chain','E-commerce','Kho vận','Xuất nhập khẩu','Fintech','Giáo dục'])}${o('Khách hàng',['SME','Chủ shop online','Công ty logistics','Nhà sản xuất','Freelancer'])}${o('Loại vấn đề',['Thủ công','Thiếu minh bạch','Chi phí','Sai sót','Tuân thủ','Giao tiếp'])}${o('Vốn',['<10 triệu','10–50 triệu','50–100 triệu'])}</div><button class="p" style="margin-top:12px" onclick="genIdeas()">Tạo 10 ý tưởng</button></div>`+(g.length?`<div class="g g2" style="margin-top:14px">${g.map((x,i)=>`<div class="c"><h3>${esc(x.name)}</h3><div>${esc(x.pitch)}</div><div class="mu" style="margin:6px 0">Giải pháp: ${esc(x.sol)}<br>MVP: ${esc(x.mvp)}<br>Doanh thu: ${esc(x.rev)}<br>Rủi ro: ${esc(x.risk)}</div><button onclick="saveGen(${i})">Lưu và chấm điểm</button></div>`).join('')}</div>`:'')},
ideas(){return pageHead('My Ideas','Tự chấm điểm 8 tiêu chí. Mặc định là 5: bạn phải có lý do để chấm cao hơn.','<button class="p np" onclick="editI()">+ Ý tưởng</button>')+(S.ideas.length?`<div class="g g2" style="margin-top:12px">${S.ideas.map(i=>`<div class="c"><div class="row" style="justify-content:space-between;margin:0"><label style="margin:0"><input type="checkbox" style="width:auto" ${sel.includes(i.id)?'checked':''} onchange="tg('${i.id}')"> So sánh</label><span class="n">${score(i)}</span></div><h3>${esc(i.name)}</h3><div class="mu">${esc(i.pitch)}</div><div style="display:flex;gap:12px;align-items:center">${radar(i.s)}<div style="flex:1">${Object.entries(W).map(([k,[l]])=>`<div class="mu">${l} ${i.s[k]}</div><div class="bar"><i style="width:${i.s[k]*10}%"></i></div>`).join('')}</div></div><div class="row"><button onclick="editI('${i.id}')">Sửa & chấm điểm</button></div></div>`).join('')}</div>`+(sel.length>1?cmp():'<p class="mu">Chọn 2–4 ý tưởng để so sánh.</p>'):empt('Chưa có ý tưởng.','<button class="p" onclick="go(\'engine\')">Mở Idea Engine</button>'))},
validation(){const ex=['Vấn đề có thật?','Xảy ra thường xuyên?','Đau đến mức nào?','Đã có giải pháp hiện tại?','Sẵn sàng trả tiền?','Khách chủ động xin giải pháp?'];
const qs={'Vấn đề':'Lần gần nhất bạn gặp vấn đề này là khi nào? Chuyện gì xảy ra?','Giải pháp hiện tại':'Bạn đang xử lý bằng cách nào? Công cụ nào?','Chi phí':'Việc đó tốn bao nhiêu tiền/giờ mỗi tháng?','Tần suất':'Bao lâu thì xảy ra một lần?','Mua hàng':'Ai quyết định mua? Lần gần nhất bạn trả tiền cho công cụ là gì?','Trả tiền':'Nếu có giải pháp, bạn trả bao nhiêu? Bạn có đặt cọc không?','Phản đối':'Điều gì khiến bạn không dùng?'};
return pageHead('Customer Interview Lab','Cần ít nhất 5 phỏng vấn trước khi quyết định.','<button class="p np" onclick="editV()">+ Ghi phỏng vấn</button>')+`<details class="c" style="margin:12px 0"><summary><b>Bộ câu hỏi phỏng vấn</b> (hỏi về quá khứ, không hỏi ý kiến)</summary>${Object.entries(qs).map(([k,v])=>`<p><b>${k}:</b> ${v}</p>`).join('')}</details>`+(S.interviews.length?`<div class="tw"><table><tr><th>Khách</th><th>Ý tưởng</th><th>Trích dẫn</th><th>Điểm</th><th></th></tr>${S.interviews.map(v=>{const s=vscore(v),l=vlab(s);return`<tr><td>${esc(v.who)}</td><td>${esc(nm(v.iid))}</td><td>"${esc(v.quote)}"</td><td><b style="color:${l[1]}">${s} ${l[0]}</b></td><td><button onclick="editV('${v.id}')">Sửa</button></td></tr>`}).join('')}</table></div>`:empt('Chưa có cuộc phỏng vấn nào. Hãy hẹn 3 người đầu tiên tuần này.'))},
fin(){const f=S.fin,sc=[['Thận trọng',.5],['Cơ sở',1],['Tích cực',1.6]],ca=calc(f,1),M=1e6,fld=[['price','Giá/tháng (VNĐ)'],['c0','Khách tháng 1'],['g','Tăng trưởng/tháng (0.15=15%)'],['vc','Chi phí biến đổi/khách'],['fix','Chi phí cố định'],['mkt','Marketing'],['team','Nhân sự'],['oth','Khác'],['cap','Vốn ban đầu'],['churn','Churn/tháng (0.05=5%)']];
const r=ca.m,last=r[11],be=r.findIndex(x=>x.net>=0)+1,cac=f.mkt/Math.max(1,r[1].cust-r[0].cust||f.c0),ltv=f.price*(1-f.vc/f.price)/Math.max(f.churn,.01);
return pageHead('Startup Financial Lab','Mọi số liệu là giả định của bạn. Thay bằng số thật khi có.')+`<div class="g g2" style="margin-top:12px"><div class="c"><h3>Giả định</h3>${fld.map(([k,l])=>`<label>${l}</label><input type="number" step="any" value="${f[k]}" onchange="S.fin.${k}=+this.value;save();render(1)">`).join('')}</div><div class="c"><h3>Kết quả (tháng 12, kịch bản cơ sở)</h3><table><tr><td>Doanh thu</td><td>${fm(last.rev)}</td></tr><tr><td>Lợi nhuận gộp</td><td>${fm(last.rev-last.var)}</td></tr><tr><td>Chi phí hoạt động</td><td>${fm(f.fix+f.mkt+f.team+f.oth)}</td></tr><tr><td>Lợi nhuận ròng</td><td>${fm(last.net)}</td></tr><tr><td>Hòa vốn</td><td>${be>0?'Tháng '+be:'Chưa trong 12 tháng'}</td></tr><tr><td>Runway</td><td>${ca.run}</td></tr><tr><td>CAC / LTV / LTV:CAC</td><td>${fm(cac)} / ${fm(ltv)} / ${(ltv/Math.max(cac,1)).toFixed(1)}</td></tr></table><p class="mu">LTV:CAC trên 3 mới tạm ổn.</p>${line([{n:'Doanh thu',c:'var(--ac)',d:r.map(x=>x.rev/M)},{n:'Lãi/lỗ',c:'var(--er)',d:r.map(x=>x.net/M)},{n:'Tiền mặt',c:'var(--ok)',d:r.map(x=>x.cash/M)}],r.map((x,i)=>i+1))}</div></div>
<div class="c tw" style="margin-top:14px"><h3>Kịch bản</h3><table><tr><th>Kịch bản</th><th>T1</th><th>T3</th><th>T6</th><th>T12</th></tr>${sc.map(([n,k])=>{const m=calc(f,k).m;return`<tr><td>${n}</td>${[0,2,5,11].map(i=>`<td>${m[i].cust.toFixed(0)} khách<br>${fm(m[i].rev)}<br><span class="mu">lãi ${fm(m[i].net)}</span></td>`).join('')}</tr>`}).join('')}</table></div>`},
plan(){const cols=[['todo','Cần làm'],['doing','Đang làm'],['done','Xong']];
return pageHead('Kế hoạch','Sprint 30 ngày và lộ trình. Mỗi việc gắn tuần/tháng.','<button class="p np" onclick="editT()">+ Việc mới</button>')+(S.tasks.length?`<div class="g g2" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${cols.map(([s,l])=>`<div class="c s"><h3>${l} (${S.tasks.filter(t=>t.st==s).length})</h3>${S.tasks.filter(t=>t.st==s).map(t=>`<div class="c" style="margin:8px 0;padding:10px"><b>${esc(t.t)}</b><div class="mu">Tuần/tháng ${t.week} · ${nm(t.iid)}</div><div class="row" style="margin:6px 0 0"><span class="tag">${t.pr}</span>${cols.filter(c=>c[0]!=s).map(c=>`<button style="min-height:32px;padding:4px 8px" onclick="setTask('${t.id}','${c[0]}')">→ ${c[1]}</button>`).join('')}<button class="d" style="min-height:32px;padding:4px 8px" onclick="if(confirm('Xóa việc?'))remove('tasks','${t.id}')">Xóa</button></div></div>`).join('')}</div>`).join('')}</div>`:empt('Chưa có việc. Bắt đầu với: phỏng vấn 3 khách hàng.'))},
risks(){const L=['Thấp','Vừa','Cao'];return pageHead('Risk Matrix','Tác động × xác suất','<button class="p np" onclick="editR()">+ Rủi ro</button>')+`<div class="mx" style="margin:12px 0">${[2,1,0].flatMap(imp=>[0,1,2].map(pro=>{const l=S.risks.filter(r=>r.imp==imp&&r.pro==pro),sv=imp+pro;return`<div style="background:${sv>=3?'#dc262633':sv==2?'#d9770633':'#16a34a22'}"><span class="mu">Tác động ${L[imp]} · XS ${L[pro]}</span>${l.map(r=>`<div><a href="#" onclick="editR('${r.id}');return false" style="color:var(--tx)">• ${esc(r.n)}</a></div>`).join('')}</div>`}))}</div>`+(S.risks.length?'':empt('Chưa có rủi ro. Hãy nghĩ: tại sao khách hàng sẽ không trả tiền?'))},
journal(){return pageHead('Startup Journal','Ghi insight, thất bại, thí nghiệm, quyết định','<button class="p np" onclick="editJ()">+ Ghi chú</button>')+(S.journal.length?[...S.journal].reverse().map(j=>`<div class="c" style="margin:10px 0"><span class="tag">${j.ty}</span> <span class="mu">${new Date(j.at).toLocaleDateString('vi-VN')}</span><p style="margin:6px 0">${esc(j.tx)}</p><button class="d" style="min-height:30px" onclick="if(confirm('Xóa ghi chú?'))remove('journal','${j.id}')">Xóa</button></div>`).join(''):empt('Nhật ký trống. Ghi điều bạn học hôm nay.'))},
decision(){const l=S.ideas;return pageHead('Should I build this?','Quyết định dựa trên điểm tự chấm và bằng chứng phỏng vấn')+(l.length?l.map(i=>{const d=decide(i),v=vavg(i.id);return`<div class="c" style="margin:12px 0;border-left:5px solid ${d[2]}"><h2>${esc(i.name)}: <span style="color:${d[2]}">${d[0]}</span></h2><p>${d[1]}</p><div class="g">${Object.entries(W).map(([k,[n]])=>`<div><div class="mu">${n}</div><b>${i.s[k]}/10</b></div>`).join('')}<div><div class="mu">Validation</div><b>${v??'—'}</b></div></div><p class="mu" style="margin-bottom:0">Tự hỏi: Ai gặp vấn đề này? Bao lâu một lần? Họ đang dùng gì? Vì sao họ chuyển? Tôi có kiếm được khách có lãi không?</p></div>`}).join(''):empt('Cần ít nhất một ý tưởng.'))},
report(){const i=topIdea(),d=i&&decide(i),pr=S.problems,iv=i?S.interviews.filter(v=>v.iid==i.id):[],L=['Thấp','Vừa','Cao'],lk=(r,t)=>`<button class="np" onclick="go('${r}')">${t}</button>`,
sec=(n,t,h,r,lb)=>`<section class="c" style="margin:12px 0;break-inside:avoid"><h3>${n}. ${t}</h3>${h||`<p class="mu" style="margin:0">Chưa có dữ liệu. ${r?lk(r,lb):''}</p>`}</section>`,
tx=v=>i&&v?`<p style="margin:0">${esc(v)}</p>`:'',pv=i&&pr.find(p=>p.id==i.pid),
avg=pr.length?(pr.reduce((a,p)=>a+p.mkt,0)/pr.length).toFixed(1):null;
const fin=[['Thận trọng',.5],['Cơ sở',1],['Tích cực',1.6]].map(([n,k])=>{const m=calc(S.fin,k).m[11];return`<tr><td>${n}</td><td>${m.cust.toFixed(0)}</td><td>${fm(m.rev)}</td><td>${fm(m.net)}</td></tr>`}).join('');
return pageHead('Startup Report','Báo cáo đầy đủ 12 phần từ dữ liệu của bạn. Bấm In / Lưu PDF để xuất.',`<span class="np"><button class="p" onclick="print()">In / Lưu PDF</button> <button onclick="if(confirm('Thay toàn bộ dữ liệu bằng demo?')){S=demo();save();render()}">Tải demo</button> <button class="d" onclick="if(confirm('Xóa toàn bộ dữ liệu?')){S=empty();save();render()}">Xóa hết</button></span>`)+
sec('0','Tóm tắt điều hành',i&&`<p style="margin:0 0 6px"><b>${esc(i.name)}</b>: ${esc(i.pitch)}</p><p style="margin:0">Điểm ý tưởng <b>${score(i)}/100</b>, kết luận <b style="color:${d[2]}">${d[0]}</b>, dựa trên ${pr.length} vấn đề và ${iv.length} cuộc phỏng vấn.</p>`,'ideas','Thêm ý tưởng')+
sec(1,'Vấn đề',pr.length&&`<div class="tw"><table><tr><th>Vấn đề</th><th>Khách hàng</th><th>Đau</th><th>Trả tiền</th><th>Bằng chứng</th></tr>${pr.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.cust)}</td><td>${p.pain}/10</td><td>${p.wtp}/10</td><td>${esc(p.ev)||'—'}</td></tr>`).join('')}</table></div>`,'problems','Thêm vấn đề')+
sec(2,'Giải pháp',i&&`<p style="margin:0 0 6px">${esc(i.sol)}</p>${pv?`<p class="mu" style="margin:0">Giải quyết vấn đề: ${esc(pv.name)}</p>`:''}`,'ideas','Thêm ý tưởng')+
sec(3,'Thị trường',i&&`<p style="margin:0">Bạn tự chấm quy mô thị trường ${i.s.mkt}/10${avg?`, trung bình các vấn đề đã ghi ${avg}/10`:''}. Đây là điểm tự đánh giá, chưa phải số liệu thị trường thật.</p>`,'ideas','Chấm điểm')+
sec(4,'Khách hàng',tx(i&&i.cust),'ideas','Thêm ý tưởng')+
sec(5,'Đối thủ và giải pháp thay thế',tx(i&&i.comp),'ideas','Cập nhật')+
sec(6,'Mô hình kinh doanh',i&&`<p style="margin:0">Doanh thu: ${esc(i.rev)||'—'}. Giá giả định: ${fm(S.fin.price)}/tháng.</p>`,'ideas','Cập nhật')+
sec(7,'MVP',tx(i&&i.mvp),'ideas','Cập nhật')+
sec(8,'Kiểm chứng',iv.length&&`<p style="margin:0 0 6px">${iv.length} phỏng vấn, điểm trung bình <b>${vavg(i.id)}/100</b> ${vlab(vavg(i.id))[0]}</p>${iv.map(v=>`<div>• ${esc(v.who)}: "${esc(v.quote)}" (${vscore(v)}/100)</div>`).join('')}`,'validation','Ghi phỏng vấn')+
sec(9,'Tài chính (tháng 12)',`<div class="tw"><table><tr><th>Kịch bản</th><th>Khách</th><th>Doanh thu</th><th>Lãi ròng</th></tr>${fin}</table></div><p class="mu" style="margin:8px 0 0">Runway: ${calc(S.fin,1).run}. Mọi số liệu là giả định bạn nhập.</p>`)+
sec(10,'Lộ trình và việc cần làm',S.tasks.length&&[...S.tasks].sort((a,b)=>a.week-b.week).map(t=>`<div>• Mốc ${t.week}: ${esc(t.t)} (${{todo:'cần làm',doing:'đang làm',done:'xong'}[t.st]})</div>`).join(''),'plan','Thêm việc')+
sec(11,'Rủi ro',S.risks.length&&S.risks.map(r=>`<div>• ${esc(r.cat)}: ${esc(r.n)} (tác động ${L[r.imp]}, xác suất ${L[r.pro]})</div>`).join(''),'risks','Thêm rủi ro')+
sec(12,'Quyết định cuối',i&&`<p style="margin:0 0 6px;color:${d[2]}"><b>${d[0]}</b></p><p style="margin:0">${d[1]}</p>`,'decision','Xem quyết định')}};
const fm=v=>(v<0?'-':'')+(Math.abs(v)>=1e6?(Math.abs(v)/1e6).toFixed(1)+'tr':Math.round(Math.abs(v)/1e3)+'k');
function calc(f,k){let cash=f.cap,m=[],c=f.c0;for(let i=0;i<12;i++){const cu=f.c0*Math.pow(1+f.g*k,i),rev=cu*f.price,v=cu*f.vc,net=rev-v-(f.fix+f.mkt+f.team+f.oth);cash+=net;m.push({cust:cu,rev,var:v,net,cash})}
const burn=-m[11].net;return{m,run:burn>0?(m[11].cash>0?Math.floor(m[11].cash/burn)+' tháng':'Hết tiền'):'Không đốt tiền ở tháng 12'}}
function cmp(){const l=S.ideas.filter(i=>sel.includes(i.id)),best=Math.max(...l.map(score));return`<div class="c tw" style="margin-top:14px"><h3>So sánh</h3><table><tr><th>Tiêu chí</th>${l.map(i=>`<th>${esc(i.name)}</th>`).join('')}</tr>${Object.entries(W).map(([k,[n]])=>`<tr><td>${n}</td>${l.map(i=>`<td>${i.s[k]}</td>`).join('')}</tr>`).join('')}<tr><th>TỔNG</th>${l.map(i=>`<th style="${score(i)==best?'color:var(--ok)':''}">${score(i)}${score(i)==best?' ★':''}</th>`).join('')}</tr></table></div>`}
const nav=[['dash','Tổng quan'],['problems','Vấn đề'],['engine','Idea Engine'],['ideas','Ý tưởng'],['validation','Kiểm chứng'],['fin','Tài chính'],['plan','Kế hoạch'],['risks','Rủi ro'],['journal','Nhật ký'],['decision','Quyết định'],['report','Báo cáo']];
function go(r){showLand=false;route=r;location.hash=r;render()}
function tg(id){sel=sel.includes(id)?sel.filter(x=>x!=id):[...sel,id].slice(-4);render(1)}
function setTask(id,s){S.tasks.find(t=>t.id==id).st=s;save();toast('Đã cập nhật');render()}
const sc8=()=>Object.entries(W).map(([k,[l]])=>({k,l:l+' (1–10)',t:'num',min:1,max:10,def:5}));
function editP(id){const p=S.problems.find(x=>x.id==id)||{};modal(id?'Sửa vấn đề':'Vấn đề mới',[{k:'name',l:'Tên vấn đề',req:1},{k:'ind',l:'Ngành'},{k:'cust',l:'Ai gặp vấn đề này?'},{k:'cur',l:'Họ đang dùng gì?'},{k:'ev',l:'Bằng chứng / nguồn',t:'area'},{k:'pain',l:'Mức đau (1–10)',t:'num',min:1,max:10,def:5},{k:'mkt',l:'Thị trường (1–10)',t:'num',min:1,max:10,def:5},{k:'urg',l:'Độ gấp (1–10)',t:'num',min:1,max:10,def:5},{k:'wtp',l:'Sẵn sàng trả (1–10)',t:'num',min:1,max:10,def:5}],p,o=>upsert('problems',o,id),id&&(()=>remove('problems',id)))}
function editI(id){const i=S.ideas.find(x=>x.id==id)||{s:{}};const fs=[{k:'name',l:'Tên',req:1},{k:'pitch',l:'Pitch một dòng'},{k:'cust',l:'Khách hàng'},{k:'sol',l:'Giải pháp',t:'area'},{k:'rev',l:'Mô hình doanh thu'},{k:'comp',l:'Đối thủ / giải pháp thay thế'},{k:'mvp',l:'MVP trong 30 ngày, 20 triệu',t:'area'},{k:'pid',l:'Vấn đề liên quan',t:'sel',o:[['','—'],...S.problems.map(p=>[p.id,p.name])]},...sc8()];
modal(id?'Sửa ý tưởng':'Ý tưởng mới',fs,{...i,...i.s},o=>{const s={};Object.keys(W).forEach(k=>{s[k]=Math.min(10,Math.max(1,o[k]||5));delete o[k]});o.s=s;upsert('ideas',o,id)},id&&(()=>remove('ideas',id)))}
function editV(id){const v=S.interviews.find(x=>x.id==id)||{a:{}};const L=['exists:Vấn đề có thật?','freq:Thường xuyên?','pain:Đau đến mức nào?','sol:Đã có giải pháp hiện tại?','wtp:Sẵn sàng trả tiền?','ask:Khách xin giải pháp?'].map(x=>x.split(':'));
modal(id?'Sửa phỏng vấn':'Phỏng vấn mới',[{k:'who',l:'Người được phỏng vấn',req:1},{k:'iid',l:'Ý tưởng',t:'sel',o:ideaOpts()},{k:'quote',l:'Trích dẫn khách hàng'},{k:'notes',l:'Ghi chú',t:'area'},...L.map(([k,l])=>({k:'a_'+k,l:l+' (0–5)',t:'num',min:0,max:5,def:0}))],{...v,...Object.fromEntries(L.map(([k])=>['a_'+k,v.a[k]]))},o=>{if(!S.ideas.length){toast('Hãy tạo ý tưởng trước');return}o.a={};L.forEach(([k])=>{o.a[k]=Math.min(5,Math.max(0,o['a_'+k]||0));delete o['a_'+k]});upsert('interviews',o,id)},id&&(()=>remove('interviews',id)))}
function editT(id){modal('Việc mới',[{k:'t',l:'Việc cần làm',req:1},{k:'week',l:'Tuần (sprint) hoặc tháng',t:'num',def:1},{k:'pr',l:'Ưu tiên',t:'sel',o:[['high','Cao'],['med','Vừa'],['low','Thấp']]},{k:'iid',l:'Ý tưởng',t:'sel',o:[['','—'],...ideaOpts()]}],{},o=>upsert('tasks',o,null,{st:'todo'}))}
function editR(id){const r=S.risks.find(x=>x.id==id)||{};const lv=[[0,'Thấp'],[1,'Vừa'],[2,'Cao']];modal('Rủi ro',[{k:'n',l:'Mô tả rủi ro',req:1},{k:'cat',l:'Loại',t:'sel',o:['Market','Product','Financial','Operational','Legal','Competition','Technology','Customer']},{k:'imp',l:'Tác động',t:'sel',o:lv,n:1},{k:'pro',l:'Xác suất',t:'sel',o:lv,n:1}],r,o=>upsert('risks',o,id),id&&(()=>remove('risks',id)))}
function editJ(){modal('Ghi chú mới',[{k:'ty',l:'Loại',t:'sel',o:['Insight','Customer feedback','Failure','Experiment','Decision','Lesson']},{k:'tx',l:'Nội dung',t:'area',req:0}],{},o=>{if(!o.tx.trim()){toast('Hãy nhập nội dung');return}upsert('journal',{...o,at:Date.now()})})}
const T=[['Quản lý đơn & đối soát COD','Theo dõi đơn, trạng thái giao và đối soát COD','Google Sheets + form + báo cáo tuần','Thuê bao 300–500k/tháng','Khách quen Excel'],['Báo giá cước vận chuyển','So sánh cước nhiều hãng trong một lần nhập','Bảng giá nhập tay + form','Phí theo đơn hoặc thuê bao','Dữ liệu giá khó thu thập'],['Theo dõi tồn kho kho nhỏ','Kiểm kê và cảnh báo hết hàng cho kho nhỏ','Airtable + mã QR','Thuê bao 200k/tháng','Cạnh tranh phần mềm kho có sẵn'],['Hồ sơ xuất nhập khẩu','Checklist chứng từ để giảm sai sót','Notion + dịch vụ thủ công','Phí theo lô hàng','Rủi ro pháp lý khi tư vấn sai'],['Cảnh báo giao trễ','Báo khách khi đơn có nguy cơ trễ','Zalo/Sheets thủ công','Thuê bao theo số đơn','Phụ thuộc dữ liệu hãng vận chuyển'],['Dịch vụ đóng gói & fulfillment mini','Nhận đóng gói và giao cho shop nhỏ','Dịch vụ thủ công, chưa cần phần mềm','Phí theo đơn','Biên lợi nhuận thấp, cần mặt bằng']];
function genIdeas(){const v=k=>$('#e_'+k).value;window.gen=Array.from({length:10},(_,n)=>{const t=T[n%6];return{name:t[0]+(n>5?' (biến thể '+v('Khách hàng')+')':''),pitch:`${t[1]} cho ${v('Khách hàng').toLowerCase()} (ngành ${v('Ngành')})`,sol:t[1],mvp:t[2],rev:t[3],risk:t[4],cust:v('Khách hàng')}});render(1);toast('Đã tạo 10 gợi ý. Hãy kiểm chứng trước khi tin.')}
function saveGen(i){const g=gen[i];S.ideas.push({id:uid(),pid:'',name:g.name,pitch:g.pitch,cust:g.cust,sol:g.sol,rev:g.rev,comp:'(Cần bạn nghiên cứu)',mvp:g.mvp,s:Object.fromEntries(Object.keys(W).map(k=>[k,5]))});save();toast('Đã lưu. Vào Ý tưởng để chấm điểm.');go('ideas')}
function render(keep){const y=scrollY;if(!S||showLand){$('#root').innerHTML=`<header class="lh"><b><span class="lg">S</span>Startup Idea Lab</b><button class="p" onclick="enter()">${S?'Vào app':'Bắt đầu'}</button></header><div class="lw"><section class="hero"><h1>Build a business from a real problem.</h1><p>Tìm vấn đề thật, kiểm chứng ý tưởng, làm MVP nhỏ nhất và tìm khách hàng trả tiền đầu tiên. Dành cho người mới bắt đầu, vốn ít, chưa có kinh nghiệm startup.</p><div class="row" style="margin-top:20px"><button class="p" onclick="enter()">${S?'Tiếp tục':'Start Building'}</button><button onclick="tryDemo()">Explore Demo</button></div></section>
<div class="fl">${[['Vấn đề','Ghi lại vấn đề kèm bằng chứng và nguồn'],['Ý tưởng','Tạo gợi ý và tự chấm điểm 8 tiêu chí'],['Kiểm chứng','Phỏng vấn khách và tính điểm tín hiệu'],['MVP','Bản nhỏ nhất làm được trong 30 ngày'],['Khách hàng','Bán thử cho những người đầu tiên'],['Doanh nghiệp','Mô hình tài chính và lộ trình 12 tháng']].map((x,i)=>`<div class="c"><b>${i+1}. ${x[0]}</b><div class="mu">${x[1]}</div></div>`).join('')}</div>
<section class="sec"><h2>Mọi công cụ phục vụ một quyết định: có nên làm không?</h2><div class="g g2"><div class="c"><h3>Problem Database</h3><div class="mu">Lưu vấn đề kèm mức đau, độ gấp, khả năng trả tiền và bằng chứng.</div></div><div class="c"><h3>Idea Engine và điểm số</h3><div class="mu">Chấm điểm theo trọng số, xem radar chart và so sánh tối đa 4 ý tưởng.</div></div><div class="c"><h3>Customer Interview Lab</h3><div class="mu">Bộ câu hỏi phỏng vấn, trích dẫn khách hàng và Validation Score /100.</div></div><div class="c"><h3>Financial Lab</h3><div class="mu">Doanh thu, lợi nhuận, runway, CAC, LTV và 3 kịch bản.</div></div><div class="c"><h3>Kế hoạch và rủi ro</h3><div class="mu">Kanban công việc, sprint 30 ngày và ma trận rủi ro.</div></div><div class="c"><h3>Decision Center</h3><div class="mu">Kết luận BUILD, VALIDATE MORE hoặc DON'T BUILD, kèm lý do rõ ràng.</div></div></div></section>
<section class="sec"><h2>Không phải "AI tạo startup cho bạn". Là công cụ giúp bạn nghĩ như một founder.</h2><ul class="qs"><li>Đây có phải vấn đề thật không?</li><li>Ai đang gặp vấn đề này?</li><li>Bao lâu xảy ra một lần?</li><li>Họ đau đến mức nào?</li><li>Họ sẵn sàng trả bao nhiêu?</li><li>Hiện họ đang dùng gì?</li><li>Vì sao họ sẽ chuyển sang giải pháp của bạn?</li><li>Bạn có kiếm được khách hàng có lãi không?</li></ul></section>
<footer class="ft">Dữ liệu được lưu ngay trong trình duyệt của bạn. Dữ liệu Demo (LogiFlow) là giả định để minh họa, không phải số liệu thị trường thật.</footer></div>`;return}
$('#root').innerHTML=`<div class="app"><nav><b><span class="lg">S</span>Startup Idea Lab</b><a onclick="showLand=true;render()">⌂ Trang giới thiệu</a>${nav.map(([k,l])=>`<a class="${route==k?'on':''}" onclick="go('${k}')">${l}</a>`).join('')}<a onclick="toggleTheme()">◐ Giao diện</a></nav><main>${(P[route]||P.dash)()}</main></div>`;if(keep)scrollTo(0,y)}
function enter(){if(!S){S=empty();save()}showLand=false;route='dash';location.hash='dash';render()}
function tryDemo(){if(S&&!S.demo&&(S.problems.length||S.ideas.length||S.interviews.length)&&!confirm('Dữ liệu hiện có sẽ bị thay bằng demo. Tiếp tục?'))return;if(!S||!S.demo){S=demo();save()}enter()}
function toggleTheme(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#fff';r.dataset.theme=d?'dark':'light'}
addEventListener('hashchange',()=>{showLand=false;route=location.hash.slice(1)||'dash';render()});render();
</script></body></html>
